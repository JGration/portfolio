<div class="app-shell">
  <app-nav></app-nav>

  <main class="app-shell__main">
    <section class="app-shell__section app-shell__section--hero">
      <app-home [@fadeState]="state"></app-home>
    </section>

    <section
      class="app-shell__section app-shell__section--about"
      id="about"
      scroll-check
      [@scrollSlide]="scrollSlide"
      (scrollState)="scrollSlide = $event"
    >
      <app-about *ngIf="scrollSlide === 'show'"></app-about>
    </section>

    <section
      class="app-shell__section app-shell__section--works"
      id="works"
      scroll-check
      [@scroll]="scroll"
      (scrollState)="scroll = $event"
    >
      <app-works *ngIf="scroll === 'show'"></app-works>
    </section>

    <section
      class="app-shell__section app-shell__section--demo"
      id="demo"
      scroll-check
      [@scroll]="scroll3"
      (scrollState)="scroll3 = $event"
    >
      <app-demo *ngIf="scroll3 === 'show'"></app-demo>
    </section>

    <section
      class="app-shell__section app-shell__section--contact"
      id="contact"
      scroll-check
      [@scroll]="scroll2"
      (scrollState)="scroll2 = $event"
    >
      <app-contact *ngIf="scroll2 === 'show'" [@fadeState]="state"></app-contact>
    </section>
  </main>

  <app-footer></app-footer>
</div>
